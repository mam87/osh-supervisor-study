<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الوحدة — موسوعة مشرف السلامة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site">
  <div class="header-row">
    <a class="brand" href="index.html"><span class="logo">🦺</span><span>موسوعة مشرف السلامة</span></a>
    <button class="hamburger" id="hamburger" aria-label="القائمة">☰</button>
    <nav class="top" id="topNav">
      <a href="index.html">الوحدات</a>
      <a href="summary.html">الملخص الشامل</a>
      <a href="quiz.html">بنك الأسئلة</a>
      <a href="numbers.html">مرجع الأرقام</a>
      <a href="equations.html">المعادلات</a>
    </nav>
    <div class="search-wrap">
      <input id="globalSearch" type="text" placeholder="ابحث في كل الوحدات…" autocomplete="off">
      <span class="search-icon">🔍</span>
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="theme-btn" id="themeToggle" title="تبديل الوضع الليلي/النهاري">🌓</button>
  </div>
</header>

<main class="wrap">
  <div id="unitRoot" class="loading">جاري التحميل…</div>
</main>

<footer class="site">
  <div class="wrap">
    إعداد: <strong>مأمون السعودي</strong> — منصة دراسية مبنية بمساعدة Claude، بالاستناد إلى مناهج معهد السلامة والصحة المهنية (مؤسسة التدريب المهني، الأردن).<br>
    <a href="https://github.com/mam87/osh-supervisor-study" target="_blank" rel="noopener">المصدر على GitHub</a>
  </div>
</footer>

<script src="assets/app.js"></script>
<script>
function toAr(n){ const d=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return String(n).split('').map(c=>/[0-9]/.test(c)?d[+c]:c).join(''); }

function slideBlock(s, colors){
  const kindClass = s.type === 'divider' || s.type === 'cover' || s.type === 'review-cover' ? 'kind-divider' : '';
  const headingTag = (s.type === 'divider' || s.type === 'cover' || s.type === 'review-cover') ? 'h1' : 'h2';
  return `<article class="slide-block ${kindClass}" id="slide-${s.i}">
    ${s.eyebrow ? `<div class="eyebrow2">${escapeHtml(s.eyebrow)}</div>` : ''}
    ${s.heading ? `<${headingTag}>${escapeHtml(s.heading)}</${headingTag}>` : ''}
    ${s.html}
  </article>`;
}

function tocEntry(s){
  const label = s.heading || s.eyebrow || ('شريحة ' + toAr(s.i+1));
  const cls = (s.type === 'divider' || s.type === 'cover' || s.type === 'review-cover') ? 'divider-link' : '';
  return `<a href="#slide-${s.i}" data-i="${s.i}" class="${cls}">${escapeHtml(label)}</a>`;
}

(async function(){
  const params = new URLSearchParams(location.search);
  const n = parseInt(params.get('u') || '1', 10);
  const root = document.getElementById('unitRoot');
  try{
    const [unit, catalog] = await Promise.all([loadJSON(`unit-${n}.json`), loadJSON('catalog.json')]);
    document.title = unit.title + ' — موسوعة مشرف السلامة';
    const c = unit.colors || {};
    document.documentElement.style.setProperty('--uc-navy', c.navy || '#101B2D');
    document.documentElement.style.setProperty('--uc-amber', c.amber || '#E8A400');
    document.documentElement.style.setProperty('--uc-amber-deep', c['amber-deep'] || '#B87800');

    const prev = catalog.find(u => u.n === n - 1);
    const next = catalog.find(u => u.n === n + 1);

    root.innerHTML = `
      <div class="unit-layout">
        <aside class="toc">
          <h3>محتوى الوحدة</h3>
          ${unit.slides.map(tocEntry).join('')}
        </aside>
        <div class="unit-main">
          <div class="unit-hero" style="--uc-navy:${c.navy || '#101B2D'}">
            <div class="un">الوحدة ${toAr(n)} ${unit.pages && unit.pages !== '—' ? '· صفحات ' + unit.pages : ''}</div>
            <h1>${escapeHtml(unit.title)}</h1>
            <p>${escapeHtml(unit.description || '')}</p>
            <div class="um"><span>${toAr(unit.slideCount)} شريحة تعليمية</span></div>
          </div>
          ${unit.slides.map(s => slideBlock(s, c)).join('')}
          <div class="unit-nav">
            ${prev ? `<a href="unit.html?u=${prev.n}"><span class="lbl">◂ الوحدة السابقة</span><span class="ttl">${escapeHtml(prev.title)}</span></a>` : '<span></span>'}
            ${next ? `<a href="unit.html?u=${next.n}"><span class="lbl">الوحدة التالية ▸</span><span class="ttl">${escapeHtml(next.title)}</span></a>` : '<span></span>'}
          </div>
        </div>
      </div>`;

    // active TOC highlight on scroll
    const links = Array.from(document.querySelectorAll('aside.toc a'));
    const blocks = Array.from(document.querySelectorAll('.slide-block'));
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if(e.isIntersecting){
          const id = e.target.id;
          links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + id));
        }
      });
    }, {rootMargin: '-15% 0px -70% 0px'});
    blocks.forEach(b => obs.observe(b));

    if(location.hash){
      const el = document.querySelector(location.hash);
      if(el) setTimeout(() => el.scrollIntoView({behavior:'instant', block:'start'}), 50);
    }
  }catch(e){
    root.innerHTML = '<div class="empty-state">تعذّر تحميل هذه الوحدة.</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
